<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Door alerts</title>
</head>
<body>
  <h1>Door alerts</h1>
  <form id="mail">
    <h2>Mail server for alerts</h2>
    <label>Host <input name="host"></label>
    <label>Port <input name="port" type="number" value="587"></label>
    <label>Username <input name="user"></label>
    <label>Password <input name="pass" type="password"></label>
    <label>Send alerts to <input name="to" type="email"></label>
    <button>Save</button>
  </form>
  <script src="settings.js"></script>
</body>
</html>
